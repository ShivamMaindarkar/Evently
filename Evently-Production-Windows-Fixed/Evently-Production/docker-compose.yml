services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["evently_pg:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [db]
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/evently
      JWT_SECRET: dev-secret-change-me
      CLIENT_URL: http://localhost:5000
    ports: ["5000:5000"]
volumes:
  evently_pg:
